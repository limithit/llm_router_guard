version: "3.9"

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-router-guard
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DB_TYPE=${DB_TYPE:-sqlite}
      # 默认指向卷内路径（SEC-02：容器重建不丢库、管理员口令不回退）
      - DB_DSN=${DB_DSN:-/app/data/db/gateway.db}
      # SEC-01/02：密钥无可用默认值——未设置时 compose 直接报错拒绝拉起（fail-safe）。
      # 生成：openssl rand -hex 32
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (openssl rand -hex 32)}
      - MASTER_KEY=${MASTER_KEY:?MASTER_KEY must be set (openssl rand -hex 32)}
      - ADMIN_USER=${ADMIN_USER:-admin}
      # 不设则首启随机生成一次性管理员口令（容器日志查看一次，首登强制修改）
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - DATA_DIR=/app/data
      - REDIS_ADDR=${REDIS_ADDR:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - HEALTH_CHECK_SECONDS=${HEALTH_CHECK_SECONDS:-30}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # M-11：/metrics Bearer 令牌（未设置则保持开放，容器日志会告警）
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      # tiktoken 离线缓存目录（配合卷挂载预置 cl100k_base，避免启动时联网下载）
      - TIKTOKEN_CACHE_DIR=${TIKTOKEN_CACHE_DIR:-/app/data/tiktoken}
    volumes:
      - ${DATA_DIR_PATH:-./data}:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # 多节点部署（DB_TYPE=postgres/mysql）时取消注释并同时设置 REDIS_ADDR=redis:6379：
    # redis:
    #   image: redis:7
    #   command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set-redis-password}"]
    #   restart: unless-stopped
