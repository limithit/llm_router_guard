version: "3.9"

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-router-guard
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DB_DSN=${DB_DSN:-gateway.db}
      - JWT_SECRET=${JWT_SECRET:-CHANGE-ME-JWT-SECRET}
      - MASTER_KEY=${MASTER_KEY:-CHANGE-ME-MASTER-KEY}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - DATA_DIR=/app/data
    volumes:
      - ${DATA_DIR_PATH:-./data}:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
